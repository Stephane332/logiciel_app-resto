name: APK Android

# Construit l'APK dans l'intégration continue : aucun outil à installer sur le poste du concepteur,
# ni Android Studio, ni SDK, ni JDK (ADR 001).
on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL de l'API (ex. https://api.exemple.bf/api/v1)"
        required: false
        default: ''
  push:
    tags: ['v*']

jobs:
  apk:
    name: Construire l'APK
    runs-on: ubuntu-latest

    env:
      # Les conditions d'étape lisent une variable d'environnement plutôt qu'un secret directement :
      # plus lisible, et le comportement ne dépend pas du contexte d'évaluation.
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Préparer le SDK Android
        uses: android-actions/setup-android@v3
        with:
          # L'action installe par défaut un paquet « tools » retiré du SDK Android depuis des
          # années : sdkmanager échoue alors avant même que Gradle ne démarre. On lui demande donc
          # explicitement de ne rien installer d'implicite — le runner fournit déjà ce qu'il faut,
          # et Gradle télécharge le reste à la demande.
          packages: ''
          accept-android-sdk-licenses: true

      - run: npm ci

      - name: Annoncer l'adresse du serveur
        # Sans adresse, l'APK ne tombe plus sur une adresse relative — donc sur lui-même, vide. Il
        # demande son serveur au premier lancement (apps/client/src/lib/server.ts). La construction
        # se poursuit donc, mais en le disant clairement : un APK de diffusion doit porter son
        # adresse, et personne ne devrait taper une adresse de serveur pour commander un burger.
        env:
          API_URL: ${{ inputs.api_url || vars.API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "::warning::APK d'essai : aucune adresse d'API."
            echo "L'application demandera son serveur au premier lancement."
            echo "Pratique pour essayer sur un réseau local — à ne pas distribuer tel quel."
            echo ""
            echo "Pour un APK de diffusion, fournissez l'adresse :"
            echo "  — au lancement du workflow, dans le champ « URL de l'API » ;"
            echo "  — ou une fois pour toutes : Réglages → Secrets and variables → Actions"
            echo "    → Variables → API_URL = https://api.votre-domaine.bf/api/v1"
          else
            echo "APK de diffusion, construit pour : $API_URL"
          fi

      # ── Avant de construire : l'application pourra-t-elle seulement joindre un serveur ? ──
      #
      # Rien ne vérifiait l'APK elle-même. Elle se construisait, s'installait, s'ouvrait — et ne
      # pouvait rien faire : son WebView refusait le contenu mixte et Android bloquait le trafic en
      # clair, alors que le serveur d'un restaurant est un PC de réseau local sans certificat. Le
      # défaut ne se voyait que sur un vrai téléphone, sans message ni journal.
      - name: Vérifier que l'APK pourra joindre un serveur de restaurant
        run: node scripts/verifier-apk.mjs

      - name: Construire l'application web
        # L'APK n'a pas de « même domaine » : l'URL de l'API doit être absolue, sinon l'application
        # installée ne trouvera jamais le serveur.
        env:
          VITE_API_URL: ${{ inputs.api_url || vars.API_URL }}
          VITE_REALTIME_URL: ${{ vars.REALTIME_URL }}
        run: npm run build --workspace @savora/client

      - name: Synchroniser Capacitor
        working-directory: apps/client
        run: npx cap sync android

      - name: Construire l'APK de débogage
        working-directory: apps/client/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: savora-apk
          path: apps/client/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      # --- Version signée, uniquement si le magasin de clés est configuré ---

      - name: Restaurer le magasin de clés
        if: env.HAS_KEYSTORE == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > apps/client/android/app/release.keystore

      - name: Construire l'APK signé
        if: env.HAS_KEYSTORE == 'true'
        working-directory: apps/client/android
        env:
          KEYSTORE_PATH: release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Publier l'APK signé
        if: env.HAS_KEYSTORE == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: savora-apk-signe
          path: apps/client/android/app/build/outputs/apk/release/*.apk
          retention-days: 90
