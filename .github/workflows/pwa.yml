name: PWA publique

# Publie l'application cliente sur GitHub Pages — une adresse stable, en HTTPS, gratuite.
#
# ┌──────────────────────────────────────────────────────────────────────────────┐
# │  Une PWA s'héberge gratuitement. Une API, non. Les deux ne se confondent pas. │
# └──────────────────────────────────────────────────────────────────────────────┘
#
# Ce que cette adresse donne, et c'est déjà beaucoup : un lien qu'on envoie, qui s'ouvre sur
# n'importe quel téléphone, et que Safari comme Chrome savent **installer** sur l'écran d'accueil.
# C'est la seule voie pour un client sur iPhone, qui n'installe pas d'APK.
#
# Ce qu'elle ne donne pas : les plats et les commandes. Ceux-là vivent dans l'API du restaurant, que
# GitHub Pages ne peut pas faire tourner. L'application déposée ici demande donc l'adresse de son
# serveur au premier lancement — et une page en HTTPS ne peut appeler qu'une API en HTTPS.
#
# Elle devient donc pleinement fonctionnelle dès qu'un restaurant a une adresse sécurisée : un
# sous-domaine gratuit (DuckDNS) sur son propre PC suffit, et le nom de domaine reste facultatif.

on:
  workflow_dispatch:
  push:
    branches: ['claude/**', main]
    paths:
      - 'apps/client/**'
      - 'packages/**'
      - '.github/workflows/pwa.yml'

# Un seul déploiement à la fois : deux publications simultanées laisseraient l'adresse dans un état
# indéterminé, à moitié ancienne et à moitié nouvelle.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publier:
    name: Construire et publier
    runs-on: ubuntu-latest

    permissions:
      contents: read
      # `pages: write` permet aussi d'activer Pages depuis le workflow : aucun réglage à faire à la
      # main dans les paramètres du dépôt.
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # ── Le seul geste que ce workflow ne peut pas faire à votre place ────────────────
      #
      # Le jeton dont dispose un workflow ne porte jamais le droit d'administrer le dépôt : il peut
      # publier sur Pages, pas *créer* le site Pages. `enablement: true` échoue donc sur
      # « Resource not accessible by integration », un message qui ne dit rien de ce qu'il faut
      # faire. On pose la question nous-mêmes, pour répondre en clair.
      #
      # On la pose **sans couper ici**, et c'est délibéré : un premier jet coupait à cet endroit, si
      # bien que tant que Pages restait éteint, la construction n'était plus ni faite ni vérifiée.
      # Un réglage manquant chez l'hébergeur n'a pas à suspendre le contrôle du code.
      - name: Pages est-il activé ?
        id: etat
        env:
          JETON: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $JETON" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/pages")

          if [ "$code" = "200" ]; then
            echo "actif=true" >> "$GITHUB_OUTPUT"
            echo "Pages est activé."
          else
            echo "actif=false" >> "$GITHUB_OUTPUT"
            echo "Pages n'est pas activé (HTTP $code) — on construit et on vérifie quand même."
          fi

      - name: Préparer Pages
        id: pages
        if: steps.etat.outputs.actif == 'true'
        uses: actions/configure-pages@v5

      # La base vient de Pages quand il est activé — lui seul sait si un domaine personnalisé est en
      # service, auquel cas l'application vit à la racine. Sinon on la déduit du nom du dépôt, qui
      # est exactement ce que Pages servira une fois activé.
      - name: Choisir la base de construction
        id: base
        env:
          ACTIF: ${{ steps.etat.outputs.actif }}
          DEPUIS_PAGES: ${{ steps.pages.outputs.base_path }}
          DEPOT: ${{ github.event.repository.name }}
        run: |
          if [ "$ACTIF" = "true" ]; then chemin="${DEPUIS_PAGES}/"; else chemin="/${DEPOT}/"; fi
          echo "chemin=$chemin" >> "$GITHUB_OUTPUT"
          echo "Base de construction : $chemin"

      - name: Construire l'application
        env:
          # GitHub Pages sert chaque dépôt sous son nom : l'application ne vit pas à la racine du
          # domaine, et tout en découle — scripts, service worker, manifeste, routeur.
          VITE_BASE: ${{ steps.base.outputs.chemin }}
          # Aucune API n'est jointe à cette construction : l'application demandera son serveur.
          VITE_ASK_SERVER: '1'
        run: npm run build --workspace @savora/client

      - name: Vérifier que la construction tient debout
        # Un déploiement qui publierait un manifeste pointant à côté donnerait une icône installée
        # menant à une page blanche — et le défaut ne se verrait qu'après coup, sur un téléphone.
        shell: bash
        run: |
          base="${{ steps.base.outputs.chemin }}"
          echo "Base attendue : $base"

          grep -q "\"start_url\":\"$base\"" apps/client/dist/manifest.webmanifest \
            || { echo "::error::Le manifeste ne démarre pas sur $base"; exit 1; }
          grep -q "\"scope\":\"$base\"" apps/client/dist/manifest.webmanifest \
            || { echo "::error::Le périmètre du manifeste n'est pas $base"; exit 1; }
          grep -q "src=\"$base" apps/client/dist/index.html \
            || { echo "::error::Les scripts de la page ne pointent pas vers $base"; exit 1; }
          test -f apps/client/dist/sw.js \
            || { echo "::error::Aucun service worker : sans lui, pas d'installation"; exit 1; }
          test -f apps/client/dist/404.html \
            || { echo "::error::Aucun repli 404.html : un lien partagé tomberait sur l'erreur de GitHub"; exit 1; }

          echo "Manifeste, scripts et service worker cohérents avec $base" >> "$GITHUB_STEP_SUMMARY"

      # La construction est faite et vérifiée. Reste à publier — et là, il faut que Pages existe.
      - name: Il manque un réglage pour publier
        if: steps.etat.outputs.actif != 'true'
        run: |
          {
            echo "## La construction est bonne, mais GitHub Pages n'est pas activé"
            echo ""
            echo "Tout a été construit et vérifié ; il ne manque qu'un réglage, une seule fois :"
            echo ""
            echo "1. **Settings** (onglet du dépôt) → **Pages** (colonne de gauche)"
            echo "2. *Build and deployment* → **Source** → choisir **GitHub Actions**"
            echo "3. Revenir ici et relancer ce workflow (bouton **Re-run all jobs**)"
            echo ""
            echo "L'adresse sera alors **https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/**"
            echo ""
            echo "_Le jeton d'un workflow ne peut pas créer le site Pages lui-même : ce droit"
            echo "n'appartient qu'au propriétaire du dépôt._"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error::GitHub Pages n'est pas activé. Settings → Pages → Source → GitHub Actions, puis relancer."
          exit 1

      - name: Déposer l'application
        if: steps.etat.outputs.actif == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/client/dist

      - name: Publier
        id: deploiement
        if: steps.etat.outputs.actif == 'true'
        uses: actions/deploy-pages@v4

      - name: Annoncer l'adresse
        if: steps.etat.outputs.actif == 'true'
        run: |
          {
            echo "## L'application est en ligne"
            echo ""
            echo "${{ steps.deploiement.outputs.page_url }}"
            echo ""
            echo "Sur iPhone : ouvrir dans **Safari**, bouton Partager, « Sur l'écran d'accueil »."
            echo "Sur Android : Chrome, menu ⋮, « Installer l'application »."
          } >> "$GITHUB_STEP_SUMMARY"
