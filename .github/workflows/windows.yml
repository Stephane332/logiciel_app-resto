name: Logiciel Windows

# Produit l'installateur Windows du logiciel restaurant.
#
# Construit sur un runner Windows : un installateur NSIS ne se fabrique pas correctement ailleurs,
# et un exe produit par émulation est exactement le genre de chose qui échoue à l'installation chez
# le client, là où personne ne peut le diagnostiquer.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  windows:
    name: Construire l'installateur
    runs-on: windows-latest
    # Six heures est la limite par défaut d'un travail GitHub. Une étape qui se bloque sur une
    # requête réseau les consommerait toutes avant de rendre la main, et l'on ne saurait qu'au bout
    # de six heures qu'il fallait simplement relancer. Trente minutes couvrent largement une
    # construction complète : la référence est de douze.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer les dépendances
        # Le verrou est produit sous Linux : il ne référence pas le binaire natif de Rollup pour
        # Windows. Ni `npm ci` ni `npm install` ne résolvent cette dépendance optionnelle tant que
        # le verrou est là — la construction échoue sur « Cannot find module
        # @rollup/rollup-win32-x64-msvc », et c'est le contournement que npm indique lui-même dans
        # son message d'erreur. Le verrou n'est pas modifié dans le dépôt : il est seulement écarté
        # le temps de cette construction, sur le runner.
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --no-audit --no-fund

      - name: Construire l'interface et la préparer
        run: npm run build:desktop

      - name: Compiler l'API
        # esbuild assemble l'API en y recopiant les paquets internes. Sans cela, le serveur embarqué
        # importerait du TypeScript que Node ne sait pas lire, et ne démarrerait pas.
        run: npm run build --workspace @savora/api

      - name: Assembler le serveur embarqué
        # L'API, ses dépendances de production, PostgreSQL et le Node qui l'exécute. C'est ce qui
        # permet au restaurateur de double-cliquer sur un seul fichier et d'avoir tout.
        #
        # C'est aussi la seule étape qui télécharge de gros fichiers depuis des serveurs tiers —
        # donc la seule qui puisse rester suspendue sur une requête sans fin. Elle a été vue tourner
        # vingt-deux minutes là où huit suffisent d'ordinaire. Une limite propre vaut mieux qu'un
        # travail qui paraît avancer : on relance, au lieu d'attendre.
        timeout-minutes: 18
        run: node scripts/preparer-serveur-embarque.mjs --plateforme win32
        env:
          # Le numéro qui reçoit la commission de la plateforme. Il appartient au concepteur, pas au
          # restaurant, et n'a donc rien à faire dans les réglages que le restaurateur voit — ni dans
          # le dépôt, qui est public. Il entre par une variable du dépôt :
          # Settings → Secrets and variables → Actions → Variables → PLATFORM_MOMO_NUMBER
          #
          # Absent, le logiciel démarre quand même : l'écran Commission dira simplement que le
          # reversement n'est pas configuré. Une caisse ne doit pas refuser de s'ouvrir pour cela.
          PLATFORM_MOMO_NUMBER: ${{ vars.PLATFORM_MOMO_NUMBER }}
          PLATFORM_MOMO_OPERATOR: ${{ vars.PLATFORM_MOMO_OPERATOR || 'ORANGE_MONEY' }}

      - name: Installer les outils d'empaquetage
        working-directory: apps/desktop
        run: npm install

      # ── Avant d'empaqueter : tout ce que le logiciel charge est-il dedans ? ──
      #
      # La liste des fichiers embarqués s'écrit à la main. Un module ajouté au logiciel et oublié
      # dans cette liste produit un installateur dont le point d'entrée réclame un fichier absent :
      # le logiciel ne démarre pas du tout — chez le client, après 229 Mo de téléchargement, et sans
      # que rien ne l'ait signalé ici. C'est arrivé une fois ; une seconde serait impardonnable.
      - name: Vérifier que rien ne manquera dans l'installateur
        run: node scripts/verifier-empaquetage.mjs

      - name: Construire l'installateur
        working-directory: apps/desktop
        run: npm run build:win
        env:
          # Aucune signature de code : le certificat coûte cher et n'est pas nécessaire pour une
          # installation interne. Windows affichera un avertissement au premier lancement, ce que
          # le guide d'installation explique.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Peser l'installateur
        # Le logiciel voyage sur une clé USB ou par WhatsApp, sur des connexions qui ne pardonnent
        # pas : la taille est une caractéristique du produit, pas un détail technique.
        shell: bash
        run: |
          for fichier in apps/desktop/release/*.exe; do
            echo "$(du -h "$fichier" | cut -f1)  $(basename "$fichier")" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Publier l'installateur
        uses: actions/upload-artifact@v4
        with:
          name: savora-pro-windows
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
          retention-days: 30
