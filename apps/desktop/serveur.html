<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <title>Savora Pro — connexion au serveur</title>
    <style>
      /*
       * Premier écran que voit le restaurateur. Il doit être évident : une seule question, un
       * exemple concret, et rien d'autre à l'écran pour l'en distraire.
       */
      :root {
        --paper: #fbf8f3;
        --ink: #1a1510;
        --ink-2: #5c534a;
        --ink-3: #8f857a;
        --brand: #d95c14;
        --brand-dark: #b34710;
        --brand-ink: #14342a;
        --line: #d8cdbc;
      }
      * { box-sizing: border-box; margin: 0; }
      body {
        font-family: ui-sans-serif, system-ui, 'Segoe UI', Roboto, sans-serif;
        background: var(--brand-ink);
        color: var(--ink);
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
      }
      .carte {
        width: 100%;
        max-width: 460px;
        background: #fff;
        border-radius: 24px;
        padding: 40px 36px;
        box-shadow: 0 24px 60px rgba(0, 0, 0, 0.35);
        display: flex;
        flex-direction: column;
        gap: 20px;
      }
      .marque { display: flex; align-items: center; gap: 12px; }
      .pastille {
        width: 44px; height: 44px; border-radius: 14px;
        background: var(--brand); display: grid; place-items: center;
        color: #fff; font-weight: 800; font-size: 20px;
      }
      h1 { font-size: 22px; letter-spacing: -0.03em; line-height: 1.15; }
      p { color: var(--ink-2); font-size: 14px; line-height: 1.55; }
      label { font-size: 13px; font-weight: 650; color: var(--ink-2); }
      input {
        width: 100%; min-height: 50px; padding: 12px 16px;
        border: none; border-radius: 14px; font: inherit;
        box-shadow: inset 0 0 0 1px var(--line);
      }
      input:focus { outline: none; box-shadow: inset 0 0 0 2px var(--brand); }
      button {
        min-height: 50px; border: none; border-radius: 999px;
        background: var(--brand); color: #fff; font: inherit; font-weight: 700;
        cursor: pointer;
      }
      button:hover { background: var(--brand-dark); }
      .indice { font-size: 12px; color: var(--ink-3); }
      .erreur { font-size: 13px; font-weight: 600; color: #c2331f; }
    </style>
  </head>
  <body>
    <main class="carte">
      <div class="marque">
        <span class="pastille">S</span>
        <div>
          <strong style="font-size: 17px">Savora Pro</strong>
          <div class="indice">Logiciel restaurant</div>
        </div>
      </div>

      <div>
        <h1>À quelle adresse se trouve votre serveur&nbsp;?</h1>
        <p style="margin-top: 8px">
          C'est l'adresse que vous a donnée votre installateur. Vous ne la saisirez qu'une fois :
          le logiciel s'en souviendra.
        </p>
      </div>

      <div style="display: flex; flex-direction: column; gap: 8px">
        <label for="adresse">Adresse du serveur</label>
        <input id="adresse" placeholder="resto.mondomaine.bf" autocomplete="off" autofocus />
        <span class="indice" id="indice">Inutile d'écrire « https:// », le logiciel s'en charge.</span>
      </div>

      <button id="valider">Se connecter</button>
    </main>

    <script>
      const champ = document.getElementById('adresse');
      const indice = document.getElementById('indice');
      const bouton = document.getElementById('valider');

      window.savora?.serveur().then((existant) => {
        if (existant) champ.value = existant;
      });

      async function valider() {
        bouton.disabled = true;
        const resultat = await window.savora.definirServeur(champ.value);
        if (!resultat?.ok) {
          indice.textContent = resultat?.message ?? 'Adresse invalide.';
          indice.className = 'erreur';
          bouton.disabled = false;
        }
      }

      bouton.addEventListener('click', valider);
      champ.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') valider();
      });
    </script>
  </body>
</html>
