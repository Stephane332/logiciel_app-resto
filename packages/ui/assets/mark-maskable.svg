<!--
  Version masquable, pour l'icône Android.

  Android rogne l'icône selon la forme choisie par le constructeur — cercle, goutte, carré arrondi.
  Le dessin est donc réduit au cercle central de sécurité : sans cette marge, la cuillère serait
  amputée sur la moitié des téléphones, et personne ne saurait pourquoi.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 108 108" width="108" height="108">
  <rect width="108" height="108" fill="#14342A"/>
  <g transform="translate(22 22) scale(1.0)">
    <ellipse cx="32" cy="22" rx="10.5" ry="12.5" fill="#D95C14"/>
    <ellipse cx="32" cy="21" rx="6" ry="7.5" fill="#FBF8F3" fill-opacity="0.22"/>
    <path d="M32 34c0 6-7 6-7 11s7 5 7 10" stroke="#D95C14" stroke-width="5.5" stroke-linecap="round" fill="none"/>
  </g>
</svg>
