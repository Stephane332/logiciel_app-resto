# Déploiement de production, sur un VPS.
#
#   cp infra/.env.prod.example infra/.env.prod   # puis renseignez les valeurs
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.prod up -d
#
# Il n'y a rien d'autre à faire. Caddy obtient les certificats HTTPS au premier démarrage et les
# renouvelle ensuite tout seul ; deux adresses sont en service dans la minute :
#
#   https://VOTRE-DOMAINE       →  l'application des clients (installable depuis Chrome Android)
#   https://pro.VOTRE-DOMAINE   →  le logiciel de l'équipe
#
# Prérequis : les deux noms pointent sur l'IP du serveur (un enregistrement A chacun), et les ports
# 80 et 443 sont ouverts. Let's Encrypt vérifie le domaine par le port 80 — fermé, aucun certificat
# ne sera délivré.

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db-data:/var/lib/postgresql/data
      # Les sauvegardes sortent du conteneur : un volume perdu ne doit pas emporter les données.
      - ./backups:/backups
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
    # Pas de port publié : seul le réseau interne y accède.

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?schema=public
      JWT_SECRET: ${JWT_SECRET}
      CORS_ORIGINS: ${CORS_ORIGINS}
      PUBLIC_CLIENT_URL: ${PUBLIC_CLIENT_URL}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-declared}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET}
      # Plateforme : reversement de la commission (ADR 009).
      PLATFORM_NAME: ${PLATFORM_NAME:-Savora}
      PLATFORM_MOMO_NUMBER: ${PLATFORM_MOMO_NUMBER}
      PLATFORM_MOMO_OPERATOR: ${PLATFORM_MOMO_OPERATOR:-ORANGE_MONEY}
      UPLOAD_DIR: /data/uploads
    volumes:
      # Les photos du catalogue vivent hors du conteneur. Stockées dedans, elles disparaîtraient au
      # premier redéploiement — et avec elles tout le travail de photographie du restaurant.
      - uploads:/data/uploads
    # Pas de port publié sur l'hôte : seul Caddy l'atteint, par le réseau interne de Compose.
    expose:
      - '4000'

  # Les deux interfaces se construisent sans adresse d'API : Caddy sert chacune sous son propre
  # domaine, API comprise, donc une adresse relative suffit et ne peut pas devenir fausse.
  client:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: client
    restart: unless-stopped
    expose:
      - '80'

  restaurant:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        APP: restaurant
    restart: unless-stopped
    expose:
      - '80'

  # ── La façade HTTPS ──
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, client, restaurant]
    environment:
      DOMAINE: ${DOMAINE}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Les certificats survivent aux redéploiements. Sans ce volume, chaque `up -d` en redemanderait
      # de nouveaux à Let's Encrypt, qui limite le nombre de demandes par semaine et par domaine :
      # quelques redéploiements suffiraient à se retrouver sans certificat pendant des jours.
      - caddy-data:/data
      - caddy-config:/config

volumes:
  uploads:
  db-data:
  caddy-data:
  caddy-config:
