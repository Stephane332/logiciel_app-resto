server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compression : sur des données mobiles comptées, ce n'est pas un réglage de confort.
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Les fichiers versionnés par leur empreinte ne changent jamais : cache maximal.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Le service worker, lui, ne doit jamais être mis en cache : c'est par lui que les mises à jour
    # arrivent. Un service worker figé gèlerait l'application sur une ancienne version.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        types { application/manifest+json webmanifest; }
    }

    # Application à page unique : toute route inconnue rend l'index, qui fait le routage.
    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
